# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs goodpractice checks and reports the results in the job log. This is
# informational rather than a hard gate: goodpractice's stylistic checks
# (line length, T/F usage, etc.) don't always match a project's own style
# conventions, so a failed check here doesn't fail the job.
on:
  push:
    branches: [main, master]
  pull_request:

name: goodpractice.yaml

permissions: read-all

jobs:
  goodpractice:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::goodpractice
          needs: check

      - name: Run goodpractice
        run: |
          gp <- goodpractice::gp(".")
          print(gp)
        shell: Rscript {0}
